<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2026-27 ONAM PICTURES</title>
  <style>
    :root {
      --bg-base: #faf6ee;
      --grid-line: rgba(201, 168, 105, 0.22);
      --card-bg: rgba(253, 250, 243, 0.94);
      --text-main: #2e261d;
      --text-muted: #8c7e6c;
      --border-color: #e4d8c3;
      --gold-accent: #c49a45;
      --gold-glow: rgba(196, 154, 69, 0.25);
      --marigold: #b85d19;
      --marigold-hover: #9c4c10;
      --error-color: #a3382c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Georgia", serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 248, 220, 0.8), transparent 75%),
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 24px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
      margin: auto 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .container {
      position: relative;
      width: 100%;
      padding: 38px 28px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 14px 35px rgba(110, 85, 45, 0.08);
      transform: translateY(0);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1), 
                  box-shadow 0.3s cubic-bezier(0.2, 0, 0.2, 1), 
                  border-color 0.3s ease;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
      cursor: default;
    }

    .header-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      margin-bottom: 10px;
      color: var(--gold-accent);
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-main);
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease;
      word-break: break-word;
    }

    /* Desktop Hover Interactions (Lift without rotation) */
    @media (hover: hover) and (pointer: fine) {
      .container:hover {
        transform: translateY(-6px);
        border-color: var(--gold-accent);
        box-shadow: 0 24px 50px rgba(110, 85, 45, 0.16), 0 0 24px var(--gold-glow);
      }

      .container:hover .header-icon {
        transform: translateY(-4px);
        color: var(--marigold);
      }

      .container:hover .header h1 {
        transform: translateY(-2px);
        color: var(--marigold);
      }

      .form-group:hover label {
        color: var(--marigold);
        transform: translateX(2px);
      }

      input:hover {
        background: #ffffff;
        border-color: var(--gold-accent);
        box-shadow: 0 4px 12px rgba(196, 154, 69, 0.12);
        transform: translateY(-2px);
      }

      .btn:hover {
        background: linear-gradient(135deg, var(--marigold-hover), #8a3f0b);
        transform: translateY(-3px);
        box-shadow: 0 8px 22px rgba(184, 93, 25, 0.4);
        letter-spacing: 0.16em;
      }

      .copyright:hover {
        opacity: 1;
        color: var(--marigold);
        letter-spacing: 0.2em;
        transform: translateY(-1px);
      }
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    input {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.25s ease;
    }

    input:focus {
      background: #ffffff;
      border-color: var(--marigold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      background: linear-gradient(135deg, var(--marigold), #a64f12);
      color: #faf6ee;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(184, 93, 25, 0.25);
      transition: all 0.25s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(184, 93, 25, 0.2);
    }

    .message {
      margin-top: 14px;
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.2em;
      letter-spacing: 0.03em;
    }

    .message.error {
      color: var(--error-color);
    }

    .success-view {
      display: none;
      text-align: center;
      opacity: 0;
      transform: scale(0.96);
      transition: all 0.4s ease;
    }

    .success-view.active {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .success-view h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--marigold);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    .success-view p {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .copyright {
      margin-top: 24px;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      color: var(--text-muted);
      opacity: 0.75;
      user-select: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    .shake {
      animation: shakeCard 0.35s ease-in-out;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body>

  <!-- Ensure audio.mp3 is uploaded to your GitHub repository in the same folder -->
  <audio id="bgAudio" src="audio.mp3" preload="auto"></audio>

  <div class="wrapper">
    <div class="container" id="loginContainer">
      <div id="loginSection">
        <div class="header">
          <div class="header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2c0 4-4 6-4 10a4 4 0 0 0 8 0c0-4-4-6-4-10z"></path>
              <path d="M12 18v4"></path>
              <path d="M8 22h8"></path>
            </svg>
          </div>
          <h1>2026-27 ONAM PICTURES</h1>
        </div>

        <form id="authForm" autocomplete="off">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required spellcheck="false" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="off" />
          </div>

          <button type="submit" class="btn">Unlock Gallery</button>
          <div class="message" id="statusMessage"></div>
        </form>
      </div>

      <div class="success-view" id="successSection">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h2>Happy Onam!</h2>
        <p>Access Granted. Loading festival album...</p>
      </div>
    </div>

    <footer class="copyright">
      &copy; le79i
    </footer>
  </div>

  <script>
    const form = document.getElementById('authForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const statusMessage = document.getElementById('statusMessage');
    const loginSection = document.getElementById('loginSection');
    const successSection = document.getElementById('successSection');
    const container = document.getElementById('loginContainer');
    const audio = document.getElementById('bgAudio');

    // Instant seamless loop
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && audio.currentTime >= audio.duration - 0.08) {
        audio.currentTime = 0;
        audio.play();
      }
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play();
    });

    // Auto-unlock audio on mobile/hosted browsers on any interaction
    const unlockAudio = () => {
      audio.play().catch(() => {});
      window.removeEventListener('touchstart', unlockAudio);
      window.removeEventListener('pointerdown', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
      window.removeEventListener('click', unlockAudio);
    };

    window.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(() => {
        window.addEventListener('touchstart', unlockAudio, { once: true });
        window.addEventListener('pointerdown', unlockAudio, { once: true });
        window.addEventListener('keydown', unlockAudio, { once: true });
        window.addEventListener('click', unlockAudio, { once: true });
      });
    });

    // Authentication (admin / admin)
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const user = usernameInput.value.trim();
      const pass = passwordInput.value;

      if (user === 'admin' && pass === 'admin') {
        statusMessage.textContent = '';
        loginSection.style.transition = 'opacity 0.25s ease';
        loginSection.style.opacity = '0';
        
        setTimeout(() => {
          loginSection.style.display = 'none';
          successSection.classList.add('active');
        }, 250);

      } else {
        statusMessage.textContent = 'Invalid credentials';
        statusMessage.className = 'message error';
        
        container.classList.remove('shake');
        void container.offsetWidth;
        container.classList.add('shake');
      }
    });
  </script>
</body>
</html>
